# Server-Betrieb: docker compose up -d --build
# Caddy holt automatisch ein Let's-Encrypt-Zertifikat für DOMAIN (aus .env) und leitet HTTPS an die App weiter.
services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdm-change-me}
      POSTGRES_DB: sdm
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdm"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sdm:${POSTGRES_PASSWORD:-sdm-change-me}@db:5432/sdm?schema=public
    # nur lokal erreichbar – von außen ausschließlich über Caddy (HTTPS)
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_INTERNAL_URL: http://app:3000
    command: ["node", "-e", "setInterval(()=>fetch('http://app:3000/api/cron',{method:'POST',headers:{Authorization:'Bearer '+process.env.CRON_SECRET}}).then(r=>r.text()).then(t=>console.log(new Date().toISOString(),t)).catch(e=>console.error(e.message)),60000)"]
    depends_on: [app]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-sdm-change-me}
    volumes: [./backups:/backups]
    # tägliche Sicherung, 30 Tage Aufbewahrung
    entrypoint: ["sh", "-c", "while true; do pg_dump -h db -U sdm sdm | gzip -9 > /backups/sdm_$$(date +%F_%H%M).sql.gz; find /backups -name 'sdm_*.sql.gz' -mtime +30 -delete; sleep 86400; done"]
    depends_on:
      db: { condition: service_healthy }

  # Nur für Tests: fängt alle E-Mails ab (Web-UI http://localhost:8025). SMTP_HOST=mailpit, SMTP_PORT=1025
  mailpit:
    image: axllent/mailpit:v1.20
    profiles: ["dev"]
    ports: ["8025:8025", "1025:1025"]

volumes:
  dbdata:
  caddy_data:
  caddy_config:
